<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰谷 ThaiGu | 飲料甜品</title>
    <meta name="description" content="泰谷精選泰式特色飲品與清爽甜品，享受沁涼解膩的南洋地道風味。">
    <meta name="keywords" content="泰谷, 飲料甜品, 泰式檸檬水, 泰式奶茶, 泰式冰茶, 泰式飲品">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/images/ico-01.png">

    <!-- CSS Files -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/aos.css">
</head>
<body class="body-bg-image">
    <!-- Page Loader -->
    <div id="page-loader" class="page-loader">
        <div class="cooking-scene">
            <svg viewBox="0 0 120 120" class="loader-svg soda">
                <rect x="45" y="40" width="30" height="50" rx="5" fill="#C25920" />
                <rect x="55" y="20" width="5" height="20" fill="#aaa" />
                <circle class="bubble" cx="60" cy="85" r="3" fill="#bbdefb" />
                <circle class="bubble" cx="60" cy="75" r="2" fill="#bbdefb" />
                <circle class="bubble" cx="60" cy="65" r="1.5" fill="#bbdefb" />
            </svg>
        </div>
    </div>

    <!-- Header -->
    <header class="header bg-header">
        <div class="container d-flex-between">
            <!-- Logo -->
            <div class="logo position-relative">
                <img class="image" src="assets/images/thaigu-logo.png" alt="泰谷 ThaiGu Logo">
                <a class="overlay-link" href="index.html"></a>
            </div>

            <!-- Navigation -->
            <nav class="navbar" id="navbar">
                <ul class="nav-menu">
                    <li><a href="main-dishes.html" class="nav-link">主食餐單</a></li>
                    <li><a href="about.html" class="nav-link">關於泰谷</a></li>
                    <li><a href="drinks.html" class="nav-link active">飲料甜品</a></li>
                    <li><a href="contact-us.html" class="nav-link">聯絡我們</a></li>
                </ul>
            </nav>

            <!-- Mobile Menu Toggle -->
            <button class="mobile-menu-toggle" id="mobile-menu-toggle">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
        </div>
    </header>

    <div class="hero-drinks" id="drink-carousel">
        <div class="show-drink">
            <!-- 1. 經典泰式奶茶 -->
            <div class="drink-item" data-bg="assets/images/backgrounds/lemons-bg.png">
                <div class="image-drink">
                    <img class="image" src="assets/images/backgrounds/thai-milk-tea.png" alt="經典泰式奶茶">
                </div>
                <div class="info-drink">
                    <h2 class="title"><strong>經典泰式奶茶</strong></h2>
                    <p class="description">嚴選泰國手標茶葉現萃慢煮，深邃醇厚的茶香融入香滑淡奶與煉乳，倒入滿杯碎冰，口感絲滑濃郁、甜而不膩，完美還原曼谷正宗道地風味。</p>
                </div>
            </div>

            <!-- 2. 泰式青檸水 -->
            <div class="drink-item" data-bg="assets/images/backgrounds/lemons-bg.png">
                <div class="image-drink">
                    <img class="image" src="assets/images/backgrounds/lemonade.png" alt="泰式香茅青檸水">
                </div>
                <div class="info-drink">
                    <h2 class="title"><strong>泰式香茅青檸水</strong></h2>
                    <p class="description">選用新鮮泰國青檸現壓特調，融入淡淡香茅清香與冰涼薄荷葉。酸甜冰爽、沁人心脾，是品嚐香濃泰菜時的最佳解膩飲品。</p>
                </div>
            </div>

            <!-- 3. 泰式特調冰茶 -->
            <div class="drink-item" data-bg="assets/images/backgrounds/lemons-bg.png">
                <div class="image-drink">
                    <img class="image" src="assets/images/backgrounds/iced-tea.png" alt="泰式特調冰茶">
                </div>
                <div class="info-drink">
                    <h2 class="title"><strong>泰式特調冰茶</strong></h2>
                    <p class="description">嚴選泰國正宗茶葉慢火熬煮，茶香馥郁深沉，搭配新鮮檸檬片與冰塊，入口回甘清甜，滿溢濃厚的南洋街頭風情。</p>
                </div>
            </div>
        </div>

        <div class="main-image-drink">
            <img class="image" src="assets/images/backgrounds/lemons-bg.png" alt="Lemon background">
        </div>
    </div>

    <!-- Scroll to Top Button -->
    <button class="scroll-to-top" id="scrollToTop" aria-label="Scroll to top">
        <svg viewBox="0 0 24 24">
            <path d="M7 14l5-5 5 5z"/>
        </svg>
    </button>

    <!-- JavaScript -->
    <script src="assets/js/hero-drinks.js"></script>
    <script src="assets/js/main-01.js"></script>
</body>
</html>
